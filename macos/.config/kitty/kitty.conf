# ═══════════════════════════════════════
# KITTY — TERMINAL SHEIKAH (versión macOS)
# Basado en sheikah-slate-os/.config/kitty/kitty.conf
# ═══════════════════════════════════════

# ── FUENTE ──────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
adjust_line_height 110%

# ── VENTANA ─────────────────────────────
background_opacity        0.88
background_blur           24
dynamic_background_opacity yes
window_padding_width      16
hide_window_decorations   titlebar-only
macos_show_window_title_in none
confirm_os_window_close   0
remember_window_size      yes
initial_window_width      110c
initial_window_height     32c

# ── SONIDO Y URLS ───────────────────────
bell_on_tab               no
enable_audio_bell         no
visual_bell_duration      0.0
scrollback_lines          10000
url_style                 curly
detect_urls               yes
copy_on_select            yes

# ── CURSOR ──────────────────────────────
cursor                #00F0FF
cursor_text_color     #000000
cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 10.0

# ── SELECCIÓN ───────────────────────────
selection_background  #FF7A00
selection_foreground  #000000

# ── PALETA SHEIKAH ──────────────────────
background  #0a1214
foreground  #e2e2d7
color0  #1a2b2c
color8  #4b696d
color1  #ff3333
color9  #ff6666
color2  #2ecc71
color10 #58d68d
color3  #f1c40f
color11 #f4d03f
color4  #0080FF
color12 #4da6ff
color5  #9b59b6
color13 #af7ac5
color6  #00f0ff
color14 #76d7c4
color7  #e2e2d7
color15 #ffffff

# ── PESTAÑAS ────────────────────────────
tab_bar_edge                 top
tab_bar_style                separator
tab_separator                ""
tab_title_template           " {index}: {title[:16]} "
active_tab_foreground        #000000
active_tab_background        #00F0FF
active_tab_font_style        bold
inactive_tab_foreground      #4b696d
inactive_tab_background      #0a1214
tab_bar_background           #0a1214
tab_bar_margin_height        4 4

# ── ATAJOS (los de Mac: Cmd+T, Cmd+W, Cmd+C/V ya vienen de serie) ──
map cmd+shift+right next_tab
map cmd+shift+left  previous_tab
map cmd+equal       change_font_size all +1.0
map cmd+minus       change_font_size all -1.0
map cmd+0           change_font_size all 0

# ── TECLADO ESPAÑOL ─────────────────────
# Opción se queda como Opción: hace falta para @ # [ ] { } \ |
macos_option_as_alt no
macos_quit_when_last_window_closed yes

# ── SHELL ───────────────────────────────
shell /opt/homebrew/bin/fish
